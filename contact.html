<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ช่องทางการติดต่อ - นางสาวอรสา ขามเดช</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body {
            background: linear-gradient(135deg, #fce7f3 0%, #fae8ff 50%, #f3e8ff 100%);
            color: #374151;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 700px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(219, 39, 119, 0.15);
            border: 2px solid #fbcfe8;
        }
        h1 {
            font-size: 1.8rem;
            color: #be185d;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .contact-card {
            background: #fdf2f8;
            padding: 18px 25px;
            border-radius: 16px;
            border: 1px solid #fbcfe8;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .contact-card:hover {
            transform: translateY(-2px);
            background: #fae8ff;
            box-shadow: 0 5px 15px rgba(219, 39, 119, 0.1);
        }
        .icon {
            font-size: 1.8rem;
            width: 50px;
            height: 50px;
            background: #fce7f3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #db2777;
            flex-shrink: 0;
        }
        .info .label {
            font-size: 0.85rem;
            color: #9d174d;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .info .value {
            font-size: 1.1rem;
            color: #4b5563;
            font-weight: 500;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
        .btn {
            background: #db2777;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #be185d;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #9ca3af;
        }
        .btn-secondary:hover {
            background: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ช่องทางการติดต่อ</h1>
        <div class="subtitle">นางสาวอรสา ขามเดช (มายมิ้นท์)</div>

        <div class="contact-grid">
            <div class="contact-card">
                <div class="icon">📞</div>
                <div class="info">
                    <div class="label">เบอร์โทรศัพท์</div>
                    <div class="value">080-046-8452</div>
                </div>
            </div>

            <div class="contact-card">
                <div class="icon">💬</div>
                <div class="info">
                    <div class="label">LINE ID</div>
                    <div class="value">Orasa_2552</div>
                </div>
            </div>

            <div class="contact-card">
                <div class="icon">📧</div>
                <div class="info">
                    <div class="label">Gmail</div>
                    <div class="value">s34470@banbung.ac.th</div>
                </div>
            </div>

            <div class="contact-card">
                <div class="icon">📸</div>
                <div class="info">
                    <div class="label">Instagram (IG)</div>
                    <div class="value">Blithemint</div>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="activities.html" class="btn btn-secondary">← กิจกรรมและผลงาน</a>
            <a href="index.html" class="btn">🏠 กลับหน้าแรก</a>
        </div>
    </div>
</body>
</html>
